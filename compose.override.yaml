services:
  # En dev exponemos Postgres al host para prisma/migraciones locales. Solo dev.
  # Debe estar tambien en la red `public`: la red `internal` es `internal: true`
  # (sin salida al host), y un puerto publicado no funciona si el contenedor solo
  # vive en una red interna.
  postgres:
    ports:
      - "5432:5432"
    networks:
      - internal
      - public

  backend:
    # Flujo real de backend: genera cliente Prisma, compila a dist y ejecuta Node.
    # No usa watch ni carpetas temporales para evitar carga innecesaria.
    command: sh -c "pnpm --filter @iptv/backend exec prisma generate && pnpm --filter @iptv/backend build && pnpm --filter @iptv/backend start"
    volumes:
      - ./apps/backend:/workspace/apps/backend
      - /workspace/apps/backend/node_modules
      - ./packages:/workspace/packages

  frontend:
    command: pnpm --filter @iptv/frontend dev --host 0.0.0.0
    environment:
      # OneDrive + Docker en Windows no propaga eventos inotify al contenedor, asi
      # que sin polling Vite nunca detecta los cambios del host (HMR muerto). Se
      # activa polling con un intervalo razonable para no castigar la CPU.
      VITE_USE_POLLING: "true"
      VITE_POLLING_INTERVAL: "1000"
    volumes:
      # Codigo en vivo desde el host (HMR). El anon volume preserva el node_modules
      # de Linux del contenedor (el del host es de Windows y romperia vite).
      - ./apps/frontend:/workspace/apps/frontend
      - /workspace/apps/frontend/node_modules