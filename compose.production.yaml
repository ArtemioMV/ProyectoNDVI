services:
  nginx:
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      target: production
      args:
        VITE_API_BASE_URL: /api/v1
    environment:
      NODE_ENV: production

  backend:
    build:
      target: production
    environment:
      NODE_ENV: production
    command: pnpm --filter @iptv/backend start

  postgres:
    ports: []