services:
  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
      - internal

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
    environment:
      VITE_API_BASE_URL: /api/v1
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - internal

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: iptv_db
      POSTGRES_USER: iptv_user
      POSTGRES_PASSWORD: iptv_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iptv_user -d iptv_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  public:
  internal:
    internal: true

volumes:
  postgres_data:
  redis_data:
